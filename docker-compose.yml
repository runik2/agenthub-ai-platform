# Docker contour for APP_MODE=docker.
# STATUS: written but NOT verified. The development machine has no Docker,
# PostgreSQL or Redis installed, so this file has never been executed.
# See README, section "Docker contour (not verified)".

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenthub}
      POSTGRES_DB: agenthub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_MODE: docker
      DATABASE_URL: postgresql+asyncpg://agenthub:${POSTGRES_PASSWORD:-agenthub}@db:5432/agenthub
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      APP_MODE: docker
      DATABASE_URL: postgresql+asyncpg://agenthub:${POSTGRES_PASSWORD:-agenthub}@db:5432/agenthub
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "app.scheduler"]
    environment:
      APP_MODE: docker
      DATABASE_URL: postgresql+asyncpg://agenthub:${POSTGRES_PASSWORD:-agenthub}@db:5432/agenthub
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
